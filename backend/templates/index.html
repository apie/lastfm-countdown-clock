<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lastfm-countdown-clock</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1><span class="red">&#9835;</span> Last.fm Event Countdown</h1>
        <p class="muted">Enter your Last.fm username to see a countdown to your next event</p>
      </div>

      <div class="card">
        <form id="username-form" hx-get="{{ url_for('events_partial') }}" hx-target="#result" hx-indicator="#spinner" hx-disabled-elt="find input, find button">
          <input type="text" name="username" value="{{ username }}" placeholder="Your Last.fm username" required />
          <button type="submit">Show Events</button>
        </form>
      </div>

      <div id="spinner" class="spinner"></div>
      <div id="result"></div>

      <footer>
        <p>Data provided by Last.fm</p>
        <p>This website is not affiliated with Last.fm</p>
      </footer>
    </div>
  </body>
</html>
